<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FileService</title>
    <link rel="icon" type="image/png" href="/icons.png">
    <link rel="apple-touch-icon" href="/icons.png">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div id="app">
        <!-- Top Toolbar -->
        <header class="toolbar">
            <div class="toolbar-left">
                <button class="icon-btn" id="homeBtn" title="首页">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                </button>
                <nav class="breadcrumb" id="breadcrumb"></nav>
            </div>
            <div class="toolbar-right">
                <button class="icon-btn back-btn" id="backBtn" title="返回上级" style="display:none;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                </button>
                <button class="icon-btn" id="uploadBtn" title="上传文件">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                </button>
                <button class="icon-btn" id="newFolderBtn" title="新建文件夹">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
                </button>
                <button class="icon-btn" id="newFileBtn" title="新建文件">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="13" x2="12" y2="17"/><line x1="10" y1="15" x2="14" y2="15"/></svg>
                </button>
                <button class="icon-btn" id="batchDownloadBtn" title="下载选中" style="display:none;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                </button>
                <button class="icon-btn danger" id="batchDeleteBtn" title="删除选中" style="display:none;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="9" y1="11" x2="9" y2="17"/><line x1="15" y1="11" x2="15" y2="17"/></svg>
                </button>
                <button class="icon-btn" id="refreshBtn" title="刷新">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                </button>
                <div class="search-box">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="text" id="searchInput" placeholder="搜索...">
                </div>
            </div>
        </header>

        <!-- File Table -->
        <main class="file-table-container">
            <table class="file-table" id="fileTable">
                <thead>
                    <tr>
                        <th class="col-select"><input type="checkbox" id="selectAllCheckbox" title="全选当前页"></th>
                        <th class="col-name sortable" data-sort="name">Name<span class="sort-arrow"></span></th>
                        <th class="col-modified sortable" data-sort="lastModified">Last Modified<span class="sort-arrow"></span></th>
                        <th class="col-size sortable" data-sort="size">Size<span class="sort-arrow"></span></th>
                        <th class="col-actions">Actions</th>
                    </tr>
                </thead>
                <tbody id="fileTableBody">
                </tbody>
            </table>
            <div id="emptyState" class="empty-state" style="display:none;">
                <p>此文件夹为空</p>
            </div>
        </main>

        <!-- Pagination. Hidden while a search is active: search always covers
             the whole listing, so the pager has nothing to page. -->
        <div class="pager" id="pager" style="display:none;">
            <div class="pager-info" id="pagerInfo"></div>
            <div class="pager-controls">
                <select class="pager-size" id="pageSizeSelect" title="每页条数">
                    <option value="10">10</option>
                    <option value="20" selected>20</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
                <span class="pager-pages" id="pagerPages">
                    <button class="pager-btn" id="prevPageBtn" title="上一页">上一页</button>
                    <span class="pager-current" id="pagerCurrent"></span>
                    <button class="pager-btn" id="nextPageBtn" title="下一页">下一页</button>
                </span>
            </div>
        </div>

        <!-- Version footer. The version number is a plain literal so it can be
             edited right here when needed; nothing else reads or reports it. -->
        <footer class="app-footer">
            <span class="app-version">版本: 1.0.7</span>
        </footer>

        <!-- Upload Progress Modal -->
        <div id="uploadModal" class="modal" style="display:none;">
            <div class="modal-backdrop"></div>
            <div class="modal-content">
                <div class="modal-header">
                    <h3>上传进度</h3>
                </div>
                <div class="modal-body" id="uploadProgressContainer">
                </div>
            </div>
        </div>

        <!-- Preview / Editor Modal -->
        <div id="previewModal" class="modal" style="display:none;">
            <div class="modal-backdrop" id="previewBackdrop"></div>
            <div class="modal-content modal-preview">
                <div class="modal-header">
                    <div class="preview-heading">
                        <span class="file-icon" id="previewIcon"></span>
                        <h3 id="previewTitle">预览</h3>
                        <span class="preview-meta" id="previewMeta"></span>
                    </div>
                    <div class="preview-toolbar">
                        <button class="icon-btn" id="previewEditBtn" title="编辑" style="display:none;">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                        </button>
                        <button class="icon-btn" id="previewOpenBtn" title="新标签页打开">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                        </button>
                        <button class="icon-btn" id="previewDownloadBtn" title="下载">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        </button>
                        <button class="icon-btn" id="previewCloseBtn" title="关闭">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                        </button>
                    </div>
                </div>
                <div class="modal-body preview-body" id="previewBody"></div>
                <div class="modal-footer preview-footer" id="previewFooter" style="display:none;">
                    <span class="preview-hint" id="previewEditHint">编辑中</span>
                    <div class="preview-footer-buttons">
                        <button class="btn btn-secondary" id="previewCancelEditBtn">取消</button>
                        <button class="btn btn-primary" id="previewSaveEditBtn">保存</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- New File Modal -->
        <div id="newFileModal" class="modal" style="display:none;">
            <div class="modal-backdrop"></div>
            <div class="modal-content">
                <div class="modal-header">
                    <h3>新建文件</h3>
                    <button class="icon-btn" id="closeNewFileBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </div>
                <div class="modal-body">
                    <input type="text" id="newFileName" class="text-input" placeholder="文件名.txt" autocomplete="off">
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" id="cancelNewFileBtn">取消</button>
                    <button class="btn btn-primary" id="confirmNewFileBtn">创建</button>
                </div>
            </div>
        </div>

        <!-- New Folder Modal -->
        <div id="newFolderModal" class="modal" style="display:none;">
            <div class="modal-backdrop"></div>
            <div class="modal-content">
                <div class="modal-header">
                    <h3>新建文件夹</h3>
                    <button class="icon-btn" id="closeNewFolderBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </div>
                <div class="modal-body">
                    <input type="text" id="newFolderName" class="text-input" placeholder="文件夹名称" autocomplete="off">
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" id="cancelNewFolderBtn">取消</button>
                    <button class="btn btn-primary" id="confirmNewFolderBtn">创建</button>
                </div>
            </div>
        </div>

        <!-- Toast Notification -->
        <div id="toast" class="toast" style="display:none;"></div>

        <!-- Hidden file input -->
        <input type="file" id="fileInput" multiple style="display:none;">
    </div>
    <script src="/app.js"></script>
</body>
</html>
